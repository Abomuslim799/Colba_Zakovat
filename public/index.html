ss="subbrand">LIGA PLATFORMASI</span></div></a><nav class="nav" id="nav"></nav><div class="tools" id="tools"></div></div></header><main class="shell" id="app"></main><footer class="shell foot">COLBA Zakovat Ligasi · Intellektual musobaqalar boshqaruv tizimi</footer><div id="modalRoot"></div>
<script>
"use strict";
let data = {
  league: "COLBA ZAKOVAT LIGASI",
  venue: "",
  news: [],
  teams: [],
  tours: [],
  appeals: [],
  appealEnabled: false,
};
let currentUser = null,
  authMode = "login",
  userList = [],
  nameCheckTimer = null,
  nameDuplicate = false;
async function api(url, body) {
  const r = await fetch(url, {
    method: body === undefined ? "GET" : "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    ...(body === undefined ? {} : { body: JSON.stringify(body) }),
  });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw Error(out.error || "Server bilan aloqa xatosi");
  return out;
}
async function reload() {
  const result = await api("/api/state");
  data = result.data;
  normalize();
  draw();
}
async function mutate(action, payload) {
  try {
    const x = await api("/api/action", { action, payload });
    data = x.data;
    normalize();
    draw();
    return true;
  } catch (e) {
    alert(e.message);
    return false;
  }
}
function setUser(user) {
  currentUser = user;
  state.role =
    user.role === "owner" ? "owner" : user.role === "admin" ? "admin" : "public";
}
async function initAuth() {
  try {
    const me = await api("/api/me");
    if (me.user) {
      setUser(me.user);
      await reload();
      state.page = "home";
    } else state.page = "login";
  } catch (e) {
    state.page = "login";
    state.error = e.message;
  }
  draw();
}
window.setAuthMode = (m) => {
  authMode = m;
  state.error = "";
  draw();
};
window.submitAuth = async (e) => {
  e.preventDefault();
  const btn = $("authSubmit");
  btn.disabled = true;
  const body = {
    email: $("authEmail").value.trim(),
    password: $("authPassword").value,
  };
  if (authMode === "register") {
    body.name = $("authName").value.trim();
    if (body.password !== $("authPassword2").value) {
      state.error = "Parollar bir xil emas";
      btn.disabled = false;
      return draw();
    }
  }
  try {
    const result = await api(
      authMode === "register" ? "/api/auth/register" : "/api/auth/login",
      body,
    );
    setUser(result.user);
    state.page = "home";
    state.error = "";
    await reload();
  } catch (err) {
    state.error = err.message;
    draw();
    const em = $("authEmail");
    if (em) em.value = body.email;
  }
};
function normalize() {
  data.teams ??= [];
  data.tours ??= [];
  data.news ??= [];
  data.appeals ??= [];
  data.appealEnabled ??= false;
  data.tours.forEach((t) => {
    t.responses ??= {};
    t.activeTeams ??= [];
    t.published ??= false;
  });
}
normalize();
let state = {
  page: "home",
  role: "public",
  adminTab: "scores",
  tourId: 1,
  round: 1,
  publicTourId: 1,
  message: "",
  error: "",
};
const $ = (id) => document.getElementById(id),
  h = (s) =>
    String(s ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );
const listTours = () => data.tours.slice().sort((a, b) => a.id - b.id),
  tour = (id) => data.tours.find((x) => x.id === Number(id)),
  team = (id) => data.teams.find((x) => x.id === id),
  approvedTeams = () => data.teams.filter((x) => x.approved),
  myTeams = () =>
    data.teams.filter((x) => x.mine || x.createdBy === currentUser?.id),
  isOwner = () => state.role === "owner",
  members = (t) => (t?.members || []).filter(Boolean),
  active = (t) => data.teams.filter((x) => t.activeTeams.includes(x.id)),
  roleLabel = () =>
    state.role === "owner"
      ? "Sayt egasi"
      : state.role === "admin"
        ? "Administrator"
        : "Kuzatuvchi";
function setPage(p) {
  state.page = p;
  state.message = "";
  state.error = "";
  draw();
  window.scrollTo({ top: 0, behavior: "instant" });
}
window.go = setPage;
function nav() {
  if (!currentUser) return "";
  const links = [
    ["home", "Asosiy"],
    ["teams", "Jamoalar"],
    ["ranking", "Reyting"],
    ["results", "Tur natijalari"],
  ];
  if (data.appealEnabled) links.push(["appeals", "Apellyatsiya"]);
  return links
    .map(
      ([p, n]) =>
        `<button class="navbtn ${state.page === p ? "active" : ""}" onclick="go('${p}')">${n}</button>`,
    )
    .join("");
}
function shell() {
  $("nav").innerHTML = nav();
  $("tools").innerHTML = !currentUser
    ? ""
    : state.role === "public"
      ? `<span class="chip">${h(currentUser.name)}</span><button class="pill" onclick="logout()">Chiqish</button>`
      : `<span class="chip">${roleLabel()}</span><button class="pill" onclick="go('manage')">⚙ Boshqaruv</button><button class="pill" onclick="logout()">Chiqish</button>`;
}
function flash(s, isError = false) {
  state.message = isError ? "" : s;
  state.error = isError ? s : "";
  draw();
}
function msgs() {
  return (
    (state.message ? `<p class="note">${h(state.message)}</p>` : "") +
    (state.error ? `<p class="warning">${h(state.error)}</p>` : "")
  );
}
function calculate(t) {
  const a = active(t),
    n = a.length,
    allQ = Array.from({ length: 36 }, (_, q) => {
      const yes = a.reduce(
        (s, tm) => s + ((t.responses[tm.id] || {})[q] === 1 ? 1 : 0),
        0,
      );
      return n - yes + 1;
    });
  const stats = a.map((tm) => {
    const res = t.responses[tm.id] || {};
    let count = 0,
      sr = 0;
    let rounds = [0, 0, 0];
    for (let q = 0; q < 36; q++)
      if (res[q] === 1) {
        count++;
        sr += allQ[q];
        rounds[Math.floor(q / 12)]++;
      }
    return { id: tm.id, name: tm.name, count, sr, rounds };
  });
  stats.sort(
    (a, b) =>
      b.count - a.count || b.sr - a.sr || a.name.localeCompare(b.name, "uz"),
  );
  return stats.map((x, i) => ({ ...x, pos: i + 1, points: n - i }));
}
function summary() {
  const map = new Map(
    approvedTeams().map((tm) => [
      tm.id,
      { id: tm.id, name: tm.name, points: 0, tours: {} },
    ]),
  );
  for (const t of listTours()) {
    if (!t.published) continue;
    for (const r of calculate(t)) {
      const x = map.get(r.id);
      if (x) {
        x.points += r.points;
        x.tours[t.id] = r.points;
      }
    }
  }
  return [...map.values()].sort(
    (a, b) => b.points - a.points || a.name.localeCompare(b.name, "uz"),
  );
}
function home() {
  const published = listTours().filter((t) => t.published).length;
  const top = summary()[0];
  return `<section class="hero"><div style="position:relative;z-index:1"><span class="herokicker">INTELLEKTUAL MUSOBAQA</span><h1>${h(data.league)}</h1><p>📍 ${h(data.venue)}</p></div><div class="heroright">✦</div></section><section class="grid3"><div class="card stat"><span class="label">Ro‘yxatdan o‘tgan jamoalar</span><strong>${approvedTeams().length}</strong></div><div class="card stat"><span class="label">Yakunlangan turlar</span><strong>${published} / ${listTours().length}</strong></div><div class="card stat"><span class="label">Umumiy reyting yetakchisi</span><strong style="font-size:${top ? "19" : "24"}px">${top && top.points ? h(top.name) : "—"}</strong></div></section><div class="sectionTitle"><h2>Turnir yangiliklari</h2><span class="hint">E’lonlar sayt egasi tomonidan kiritiladi</span></div><div class="card pad">${data.news.length ? data.news.map((n) => `<article class="news"><time>${h(n.date)}</time><strong>${h(n.title)}</strong><p>${h(n.body)}</p></article>`).join("") : `<div class="empty">Hozircha yangilik yo‘q</div>`}</div><div class="sectionTitle"><h2>Tezkor o‘tish</h2></div><div class="grid2"><div class="card pad"><strong>Jamoalar</strong><p class="muted">Jamoa tarkibini ko‘ring yoki yangi jamoa ro‘yxatdan o‘tkazing.</p><button class="primary" onclick="go('teams')">Jamoalarni ko‘rish →</button></div><div class="card pad"><strong>Reyting</strong><p class="muted">Tasdiqlangan turlarda berilgan reyting ballarining umumiy yig‘indisi.</p><button class="primary" onclick="go('ranking')">Reytingni ko‘rish →</button></div></div>`;
}
function myApplications() {
  const mine = myTeams().filter((t) => !t.approved);
  if (!mine.length) return "";
  const label = (t) =>
    t.status === "rejected"
      ? '<span class="tag" style="background:#fdecee;color:var(--red)">Rad etilgan</span>'
      : '<span class="tag">Tasdiq kutilmoqda</span>';
  return `<div class="sectionTitle"><h2>Mening arizalarim</h2></div><div class="card pad">${mine.map((t) => `<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><strong>${h(t.name)}</strong><div class="notice">${members(t).length} a’zo</div></div>${label(t)}</div>`).join("")}</div>`;
}
function teamsPage() {
  const list = approvedTeams();
  const hasPending = myTeams().some((t) => t.status === "pending");
  return `<div class="pagehead"><h1>Jamoalar</h1><p>Ro‘yxatga olingan jamoalar va ularning a’zolari</p></div>${msgs()}<div class="card pad"><div class="row between"><div><strong>Yangi jamoa</strong><p class="notice" style="margin:3px 0">Sardor va kamida 3 nafar a’zoni kiriting. Ariza admin tasdiqlagach ro‘yxatda ko‘rinadi.</p></div><button class="primary" onclick="go('register')" ${hasPending ? 'disabled title="Avvalgi arizangiz ko‘rib chiqilmoqda"' : ""}>+ Ro‘yxatdan o‘tish</button></div></div>${myApplications()}<div class="sectionTitle"><h2>Tasdiqlangan jamoalar (${list.length})</h2></div>${
    list.length
      ? `<div class="grid2">${list
          .map(
            (t, i) =>
              `<div class="card teamcard"><div class="teamhead"><div class="teamicon">${i + 1}</div><div class="flex1"><h3>${h(t.name)}</h3><small>${members(t).length} nafar o‘yinchi</small></div><span class="tag">Ro‘yxatda</span></div><button class="membertoggle" onclick="toggleMembers('${t.id}')" aria-expanded="false" id="memberbtn_${t.id}">▾ Jamoa a’zolarini ko‘rish</button><ol class="memberlist hidden" id="members_${t.id}">${members(
                t,
              )
                .map(
                  (m, j) =>
                    `<li>${h(m)}${j === 0 ? ' <span class="tag">Sardor</span>' : ""}</li>`,
                )
                .join("")}</ol></div>`,
          )
          .join("")}</div>`
      : `<div class="card empty">Hozircha jamoalar ro‘yxatdan o‘tmagan.</div>`
  }`;
}
window.toggleMembers = (id) => {
  const e = $("members_" + id),
    b = $("memberbtn_" + id);
  e.classList.toggle("hidden");
  b.textContent = e.classList.contains("hidden")
    ? "▾ Jamoa a’zolarini ko‘rish"
    : "▴ Jamoa a’zolarini yashirish";
  b.setAttribute("aria-expanded", !e.classList.contains("hidden"));
};
function registerPage() {
  nameDuplicate = false;
  return `<div class="pagehead"><h1>Yangi jamoani ro‘yxatdan o‘tkazish</h1><p>Jamoa nomi, sardor va o‘yinchilar ism-familiyasini kiriting.</p></div><div class="card pad" style="max-width:760px">${msgs()}<form id="registerForm" onsubmit="registerTeam(event)"><div class="fieldgroup"><label>Jamoa nomi *</label><input class="field" id="teamname" maxlength="80" required placeholder="Masalan: Zukkolar" oninput="nameCheck()"></div><div class="gridfields">${Array.from({ length: 8 }, (_, i) => `<div class="fieldgroup"><label>${i === 0 ? "1. Jamoa sardori *" : i + 1 + ". O‘yinchi" + (i < 4 ? " *" : " (ixtiyoriy)")}</label><input class="field" id="p${i}" maxlength="100" placeholder="Ism Familiya" oninput="checkRegister()"></div>`).join("")}</div><p id="regcount" class="notice">Kamida 4 nafar, ko‘pi bilan 8 nafar o‘yinchi kiritiladi.</p><button class="primary" id="regsubmit" type="submit" disabled>Ro‘yxatdan o‘tishni tasdiqlash</button> <button class="pill" type="button" onclick="go('teams')">Bekor qilish</button></form></div>`;
}
window.checkRegister = () => {
  const name = $("teamname")?.value.trim() || "",
    arr = Array.from({ length: 8 }, (_, i) => $("p" + i)?.value.trim() || ""),
    n = arr.filter(Boolean).length;
  const valid = !!name && !!arr[0] && n >= 4 && !nameDuplicate;
  $("regsubmit").disabled = !valid;
  $("regcount").textContent =
    `To‘ldirilgan: ${n}/8. ${n < 4 ? "Yana " + (4 - n) + " nafar kerak." : nameDuplicate ? "O‘xshash nom, iltimos boshqa nom tanlang." : "Tasdiqlash mumkin."}`;
};
window.nameCheck = () => {
  nameDuplicate = false;
  checkRegister();
  clearTimeout(nameCheckTimer);
  const name = $("teamname")?.value.trim();
  if (name?.length >= 3)
    nameCheckTimer = setTimeout(async () => {
      try {
        const result = await api(
          "/api/team/name-check?name=" + encodeURIComponent(name),
        );
        if ($("teamname")?.value.trim() !== name) return;
        nameDuplicate = result.similar;
        checkRegister();
      } catch (e) {}
    }, 300);
};
window.registerTeam = async (e) => {
  e.preventDefault();
  const name = $("teamname").value.trim(),
    members = Array.from({ length: 8 }, (_, i) =>
      $("p" + i).value.trim(),
    ).filter(Boolean);
  if (members.length < 4 || !$("p0").value.trim() || !name) return;
  try {
    const result = await api("/api/team", { name, members });
    state.page = "teams";
    await reload();
    state.message = result.message;
    draw();
  } catch (e) {
    state.error = e.message;
    draw();
  }
};

function scoresAdmin() {
  const t = selectedTour();
  if (!t) return '<div class="card pad">Tur mavjud emas.</div>';
  const players = active(t),
    r = state.round,
    base = (r - 1) * 12,
    stats = calculate(t),
    scoring = new Map(stats.map((s) => [s.id, s]));
  return `<div class="card pad"><div class="row between"><div><h2 style="margin:0 0 4px">Javoblarni kiritish</h2><span class="notice">Bu jadval faqat admin va sayt egasiga ko‘rinadi.</span></div><span class="status ${t.published ? "ok" : ""}">${t.published ? "Natijalar e’lon qilingan" : "Natijalar yopiq"}</span></div><div class="spacer"></div><div class="controls">${adminTourPicker()}<div class="row">${[1, 2, 3].map((n) => `<button class="tabchip ${n === r ? "active" : ""}" onclick="selectRound(${n})">R${n} · ${12 * (n - 1) + 1}–${12 * n}</button>`).join("")}</div></div><p class="notice">Har bir katakdagi <strong>−</strong> belgisini bossangiz <strong>+</strong> ga, yana bossangiz <strong>−</strong> ga o‘zgaradi. Sichqoncha bilan kursor joylashgan <strong>jamoa qatori va savol ustuni</strong> ajratib ko‘rsatiladi. O‘zgarishlar avtomatik saqlanadi.</p>${
    players.length
      ? `<div class="scoreboardwrap"><table class="scoreboard" id="scoreboard"><thead><tr><th>Jamoa / Savol</th>${Array.from({ length: 12 }, (_, j) => `<th data-col="${j}">S${base + j + 1}</th>`).join("")}<th>R${r} jami</th></tr></thead><tbody>${players
          .map((tm) => {
            const obj = t.responses[tm.id] || {};
            return `<tr data-team="${tm.id}"><td>${h(tm.name)}</td>${Array.from(
              { length: 12 },
              (_, j) => {
                const q = base + j,
                  yes = obj[q] === 1;
                return `<td data-col="${j}" data-tm="${tm.id}"><button type="button" class="${yes ? "yes" : "no"}" onclick="flip('${tm.id}',${q})" ${t.published ? "disabled" : ""} title="${h(tm.name)} · ${q + 1}-savol: ${yes ? "to‘g‘ri" : "noto‘g‘ri"}">${yes ? "+" : "−"}</button></td>`;
              },
            ).join(
              "",
            )}<td class="summary">${scoring.get(tm.id)?.rounds[r - 1] ?? 0}</td></tr>`;
          })
          .join("")}</tbody></table></div>`
      : `<div class="empty">Bu turda jamoa tanlanmagan. “Tur jamoalari” bo‘limida qatnashuvchilarni belgilang.</div>`
  }<div class="spacer"></div><div class="row between"><span class="notice">Tanlangan turda ${players.length} ta jamoa · Barcha savollar bo‘yicha hisob avtomatik</span>${!t.published ? `<button class="primary" onclick="publishTour(${t.id})">✓ Natijalarni tasdiqlash va e’lon qilish</button>` : isOwner() ? `<button class="smallbtn danger" onclick="unpublishTour(${t.id})">Natijalarni qayta ochish (reytingdan vaqtincha chiqarish)</button>` : '<span class="notice">Qayta ochish faqat sayt egasiga ruxsat etilgan</span>'}</div></div><div class="sectionTitle"><h2>Hisoblanayotgan tur natijalari</h2></div>${resultTable(stats)}</div>`;
}

}

  const n = Number($("tourCount").value);
  if (
    n < data.tours.length &&
    !confirm("Oxirgi turlar o‘chiriladi. Davom etilsinmi?")
  )
    return;
  await mutate("toursCount", { count: n });
  state.tourId = Math.min(state.tourId, n);
  state.publicTourId = Math.min(state.publicTourId, n);
};
window.renameTour = async (id) => {
  const t = tour(id),
    title = prompt("Tur nomi:", t.title);
  if (title !== null) await mutate("renameTour", { tourId: id, title });
};
function settingsAdmin() {
  return `<div class="card pad"><h2 style="margin-top:0">Sayt egasi sozlamalari</h2><label class="switch"><div><strong>Apellyatsiya oynasini ko‘rsatish</strong><div class="notice">Yoqilganda ommaviy menyuga “Apellyatsiya” bo‘limi qo‘shiladi. Bu sozlamani faqat sayt egasi o‘zgartiradi.</div></div><input type="checkbox" ${data.appealEnabled ? "checked" : ""} onchange="setAppealEnabled(this.checked)"></label><div class="spacer"></div><div class="note"><strong>Huquqlar:</strong><br>Sayt egasi — asosiy sahifa, yangiliklar, turlar soni, apellyatsiya oynasi, jamoalar va natijalar.<br>Administrator — jamoalar, tur ishtirokchilari, raundlar, javoblar, apellyatsiya murojaatlari va tur natijalarini e’lon qilish.<br>Kuzatuvchi — ommaviy sahifalar va jamoa ro‘yxatga olish.</div><div class="spacer"></div><button class="pill" onclick="downloadJSON()">⬇ Ma’lumotlarni JSON sifatida saqlash</button></div>`;
}
window.setAppealEnabled = async (enabled) =>
  await mutate("appealEnabled", { enabled });
window.downloadJSON = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], {
      type: "application/json",
    }),
    u = URL.createObjectURL(blob),
    a = document.createElement("a");
  a.href = u;
  a.download = "colba-zakovat-zaxira.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
};
function usersAdmin() {
  return `<div class="card pad"><div class="row between"><h2 style="margin:0">Foydalanuvchi ma’lumotlari</h2><span class="tag">Faqat sayt egasi</span></div><p class="notice">Ro‘yxatdan o‘tgan foydalanuvchilar. Parolni unutgan foydalanuvchiga “Parol” tugmasi orqali yangi parol o‘rnating.</p><div class="tablewrap"><table class="datatable"><thead><tr><th>№</th><th>Foydalanuvchi</th><th>Email</th><th>Huquq</th><th>Oxirgi kirish</th><th>Sozlash</th><th>Parol</th></tr></thead><tbody>${userList.map((u, i) => `<tr><td>${i + 1}</td><td>${h(u.name)}</td><td>${h(u.email)}</td><td>${u.role === "owner" ? "Sayt egasi" : u.role === "admin" ? "Admin" : "Foydalanuvchi"}</td><td>${new Date(u.last_seen).toLocaleString("uz-UZ")}</td><td>${u.role === "owner" ? "—" : `<select class="field" onchange="changeUserRole('${u.id}',this.value)"><option value="user" ${u.role === "user" ? "selected" : ""}>Foydalanuvchi</option><option value="admin" ${u.role === "admin" ? "selected" : ""}>Admin</option></select>`}</td><td>${u.role === "owner" ? "—" : `<button class="smallbtn pill" onclick="resetPassword('${u.id}')">Parol</button>`}</td></tr>`).join("")}</tbody></table></div></div>`;
}
window.changeUserRole = async (id, role) => {
  try {
    await api("/api/users/" + encodeURIComponent(id) + "/role", { role });
    userList = (await api("/api/users")).users;
    draw();
  } catch (e) {
    alert(e.message);
  }
};
window.resetPassword = async (id) => {
  const u = userList.find((x) => x.id === id);
  const pw = prompt(`${u?.name || "Foydalanuvchi"} uchun yangi parol (kamida 6 belgi):`);
  if (pw === null) return;
  try {
    await api("/api/users/" + encodeURIComponent(id) + "/password", {
      password: pw,
    });
    alert("Yangi parol o‘rnatildi. Uni foydalanuvchiga yetkazing.");
  } catch (e) {
    alert(e.message);
  }
};
function installGridHover() {
  const table = $("scoreboard");
  if (!table) return;
  table.addEventListener("mouseover", (e) => {
    let td = e.target.closest("td[data-col]");
    if (!td) return;
    let row = td.parentElement,
      j = td.dataset.col;
    table
      .querySelectorAll(".axis,.cross")
      .forEach((x) => x.classList.remove("axis", "cross"));
    row.querySelectorAll("td").forEach((x) => x.classList.add("axis"));
    table
      .querySelectorAll(`[data-col="${j}"]`)
      .forEach((x) => x.classList.add("axis"));
    td.classList.add("cross");
  });
  table.addEventListener("mouseleave", () =>
    table
      .querySelectorAll(".axis,.cross")
      .forEach((x) => x.classList.remove("axis", "cross")),
  );
}
function draw() {
  if (!currentUser) state.page = "login";
  if (state.page === "appeals" && !data.appealEnabled) state.page = "home";
  if (state.page === "manage" && state.role === "public") state.page = "login";
  shell();
  $("app").innerHTML = (
    {
      home: home,
      teams: teamsPage,
      register: registerPage,
      ranking: rankingPage,
      results: resultPage,
      appeals: appealsPage,
      login: loginPage,
      manage: adminPage,
    }[state.page] || home
  )();
  installGridHover();
}
draw();
initAuth();
