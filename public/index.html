/* ===== Yangi dizayn: hisob taxtasi, kirish, bosh sahifa ===== */
:root{--baize:#0E3B2C;--board:#13563F;--chalk:#F3F6F1;--brass:#E2B44B;--brass-ink:#7A5A12;--colba:#178451;--display:"Unbounded","Arial Black",system-ui,sans-serif;--text:"Onest",Inter,system-ui,sans-serif}
body{font-family:var(--text)}

/* --- Hisob taxtasi --- */
.zb{--rowh:34px;background:var(--board);border-radius:18px;padding:18px 18px 14px;color:var(--chalk);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);font-variant-numeric:tabular-nums;position:relative}
.zb-head,.zb-row,.zb-foot{display:grid;grid-template-columns:26px minmax(84px,150px) 1fr 40px 40px;align-items:center;column-gap:12px}
.zb-head{font-size:12px;color:rgba(243,246,241,.62);padding-bottom:8px}
.zb-rounds{display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:10px}
.zb-rounds span{border-top:1px solid rgba(243,246,241,.22);padding-top:6px}
.zb-num{text-align:right}
.zb-body{position:relative;transition:height .3s}
.zb-row{position:absolute;left:0;right:0;height:var(--rowh);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.zb-pos{font:700 13px/1 var(--display);color:rgba(243,246,241,.55);text-align:center}
.zb-row.lead .zb-pos{color:var(--brass)}
.zb-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zb-cells{display:grid;grid-template-columns:repeat(12,1fr) 10px repeat(12,1fr) 10px repeat(12,1fr);column-gap:3px;align-items:center;height:100%}
.zb-gap{display:block}
.zb-c{display:block;height:20px;border-radius:4px;background:rgba(243,246,241,.09);transition:background .25s,transform .2s,box-shadow .2s}
.zb-c.on{background:var(--brass)}
.zb-play .zb-c.on:not(.in){background:rgba(243,246,241,.09)}
.zb-play .zb-c.on.in{animation:zbIn .35s ease-out}
@keyframes zbIn{from{transform:scaleY(.2);background:#fff6dc}to{transform:none}}
.zb-c.zb-hot{box-shadow:0 0 0 2px rgba(243,246,241,.75)}
.zb-live .zb-c{cursor:pointer}
.zb-live .zb-c:hover{transform:scale(1.18)}
.zb-count{font:700 15px/1 var(--display)}
.zb-sr{font-weight:600;color:rgba(243,246,241,.75)}
.zb-foot{margin-top:8px;height:34px;align-items:end}
.zb-foot-label{font-size:12px;color:rgba(243,246,241,.62);text-align:right;align-self:end;padding-bottom:2px;white-space:nowrap}
.zb-foot .zb-cells{align-items:end}
.zb-bar{display:block;height:calc(var(--h,0) * 30px);min-height:2px;background:rgba(226,180,75,.42);border-radius:3px 3px 0 0;transition:height .4s}
.zb-bar.zb-hot{background:var(--brass)}
.zb-cap{margin:12px 0 0;min-height:42px;font-size:14px;line-height:1.5;color:rgba(243,246,241,.82);max-width:68ch}

/* --- Kirish sahifasi --- */
body.is-auth .top,body.is-auth .foot{display:none}
body.is-auth #app.shell{max-width:none;padding:0}
.za{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,1fr);min-height:100vh}
.za-stage{background:var(--baize);color:var(--chalk);padding:40px clamp(24px,5vw,72px) 48px;display:flex;flex-direction:column;justify-content:center}
.za-brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;margin-bottom:auto;padding-bottom:40px}
.za-brand img{background:#fff;border-radius:10px;padding:4px}
.za-title{font:800 clamp(34px,4.6vw,64px)/1.02 var(--display);letter-spacing:-.02em;margin:0 0 20px;max-width:13ch}
.za-lede{font-size:17px;line-height:1.6;color:rgba(243,246,241,.8);max-width:58ch;margin:0 0 28px}
.za-stage .zb{background:rgba(0,0,0,.18)}
.za-stats{margin:18px 0 0;color:rgba(243,246,241,.62);font-size:14px;min-height:21px}
.za-panel{background:var(--chalk);display:flex;flex-direction:column;justify-content:center;padding:40px clamp(24px,4vw,64px)}
.za-form{width:100%;max-width:400px;margin:auto 0}
.za-form h2{font:800 30px/1.1 var(--display);margin:0 0 8px;letter-spacing:-.01em;color:var(--baize)}
.za-sub{margin:0 0 24px;color:#5a6d63;font-size:15px}
.za-switch{display:grid;grid-template-columns:1fr 1fr;background:#e3eae4;border-radius:12px;padding:4px;margin-bottom:22px}
.za-switch button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:650;color:#4d6258}
.za-switch button.on{background:#fff;color:var(--baize);box-shadow:0 1px 3px rgba(14,59,44,.14)}
.za-field{display:block;margin-bottom:14px}
.za-field span{display:block;font-size:13px;font-weight:600;color:#3d5148;margin-bottom:6px}
.za-field input{width:100%;border:1.5px solid #cfdad2;background:#fff;border-radius:11px;padding:13px 14px;font-size:15px;color:var(--ink);transition:border-color .15s}
.za-field input:focus{outline:none;border-color:var(--colba);box-shadow:0 0 0 3px rgba(23,132,81,.16)}
.za-submit{width:100%;margin-top:8px;background:var(--colba);color:#fff;border:0;border-radius:11px;padding:14px;font:700 15px/1 var(--text)}
.za-submit:hover{background:#0f6e42}
.za-hint{margin:16px 0 0;font-size:13px;color:#6b7d74;line-height:1.5}
.za-credit{margin:32px 0 0;font-size:13px;color:#6b7d74}
.za-credit strong{color:var(--baize)}
@media (max-width:960px){.za{grid-template-columns:1fr}.za-panel{order:-1;padding-top:32px}.za-form{margin:0 auto}.za-credit{text-align:center}.za-brand{padding-bottom:24px}}

/* --- Bosh sahifa --- */
.zh-hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:28px;align-items:stretch;background:var(--baize);color:var(--chalk);border-radius:24px;padding:clamp(24px,4vw,44px);margin:28px 0 20px}
.zh-hero h1{font:800 clamp(30px,4vw,54px)/1.04 var(--display);letter-spacing:-.02em;margin:0 0 12px;max-width:16ch}
.zh-venue{margin:0 0 32px;color:rgba(243,246,241,.74);font-size:16px}
.zh-season-top{display:flex;justify-content:space-between;font-size:13px;color:rgba(243,246,241,.66);margin-bottom:10px}
.zh-track{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.zh-seg{height:40px;border-radius:8px;border:1.5px solid rgba(243,246,241,.24);background:transparent;color:rgba(243,246,241,.62);font:700 12px/1 var(--display);padding:0}
.zh-seg.done{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.zh-seg.done:hover{filter:brightness(1.08)}
.zh-seg:disabled{opacity:1;cursor:default}
.zh-card{background:rgba(243,246,241,.07);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px}
.zh-card h2{font:700 20px/1.2 var(--display);margin:0}
.zh-card p{margin:0;color:rgba(243,246,241,.78);line-height:1.5}
.zh-card .za-submit{margin-top:auto}
.zh-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 0}
.zh-facts div{background:rgba(0,0,0,.16);border-radius:12px;padding:10px 12px}
.zh-facts dt{font-size:12px;color:rgba(243,246,241,.62)}
.zh-facts dd{margin:4px 0 0;font:700 17px/1.1 var(--display);color:var(--brass)}
.zh-tasks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zh-task{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:rgba(0,0,0,.16);border:0;border-radius:12px;padding:12px;color:rgba(243,246,241,.7)}
.zh-task strong{font:800 24px/1 var(--display);color:rgba(243,246,241,.45)}
.zh-task.due strong{color:var(--brass)}
.zh-task.due{color:var(--chalk)}
.zh-task:hover{background:rgba(0,0,0,.26)}
.zh-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.zh-link{background:transparent;border:1.5px solid currentColor;border-radius:999px;padding:8px 14px;font-weight:650;color:inherit}
.zh-card .zh-link{color:var(--chalk);border-color:rgba(243,246,241,.4)}
.zh-card .zh-link:hover{border-color:var(--chalk)}
.zh-muted{color:#6b7d74;font-size:14px}
.zh-card .zh-muted{color:rgba(243,246,241,.62)}
.zh-board{margin:0 0 20px}
.zh-board-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 2px 12px}
.zh-board-head h2{font:700 20px/1.2 var(--display);margin:0;color:var(--baize)}
.zh-board-head .zh-link{color:var(--colba);border-color:#bfdccb;font-size:14px;padding:6px 12px}
.zh-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:12px}
.zh-panel{background:#fff;border-radius:20px;padding:22px 24px;box-shadow:0 0 0 1px var(--line)}
.zh-rank{list-style:none;margin:0;padding:0}
.zh-rank li{display:grid;grid-template-columns:28px minmax(0,1.2fr) 1fr 40px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.zh-rank li:first-child{border-top:0}
.zh-rank-pos{font:700 14px/1 var(--display);color:#8a9a92}
.zh-rank li:first-child .zh-rank-pos{color:var(--brass-ink)}
.zh-rank-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zh-rank-bar{height:8px;background:#edf2ee;border-radius:99px;overflow:hidden}
.zh-rank-bar i{display:block;height:100%;background:var(--colba);border-radius:99px}
.zh-rank li:first-child .zh-rank-bar i{background:var(--brass)}
.zh-rank strong{text-align:right;font:700 15px/1 var(--display)}
.zh-news{padding:12px 0;border-top:1px solid var(--line)}
.zh-news:first-of-type{border-top:0;padding-top:0}
.zh-news time{font-size:12px;color:#8a9a92}
.zh-news h3{margin:4px 0;font-size:16px}
.zh-news p{margin:0;color:#4d6258;line-height:1.55;max-width:70ch}
@media (max-width:900px){.zh-hero,.zh-cols{grid-template-columns:1fr}}
@media (max-width:640px){
  .zb{--rowh:30px;padding:14px 10px 10px;border-radius:14px}
  .zb-head,.zb-row,.zb-foot{grid-template-columns:18px minmax(64px,92px) 1fr 26px 30px;column-gap:6px}
  .zb-cells{column-gap:1.5px;grid-template-columns:repeat(12,1fr) 5px repeat(12,1fr) 5px repeat(12,1fr)}
  .zb-c{height:16px;border-radius:2px}
  .zb-name{font-size:12px}.zb-count{font-size:13px}.zb-sr{font-size:12px}
  .zb-rounds{column-gap:5px;font-size:10px}
  .zb-foot-label{font-size:10px;white-space:normal;line-height:1.1}
  .zh-facts{grid-template-columns:1fr 1fr 1fr}.zh-tasks{grid-template-columns:1fr 1fr}
  .zh-track{gap:3px}.zh-seg{height:34px;font-size:10px}
}
@media (prefers-reduced-motion:reduce){.zb-row,.zb-c,.zb-bar,.zb-body{transition:none!important;animation:none!important}}
.za :focus-visible,.zh-hero :focus-visible,.zb :focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* --- Nozik harakat --- */
/* Yorug'lik to'lqini: oltin kataklar ustundan-ustunga navbat bilan ohista yorishadi — har 8 soniyada taxta bo'ylab chapdan o'ngga */
.zb-c.on{animation:zbWave 8s ease-in-out infinite;animation-delay:calc(var(--q) * 45ms + var(--r) * 22ms + .8s)}
@keyframes zbWave{0%,7%,100%{background-color:var(--brass);box-shadow:0 0 0 0 rgba(255,226,150,0)}3.5%{background-color:#FFEAB0;box-shadow:0 0 9px 1px rgba(255,226,150,.5)}}
/* Kirish sahifasi: sarlavha va matn taxta bilan bitta ketma-ketlikda ohista paydo bo'ladi */
.za-title,.za-lede,.za-stage .zb,.za-form{animation:zaRise .9s cubic-bezier(.2,.7,.2,1) both}
.za-lede{animation-delay:.08s}.za-stage .zb{animation-delay:.16s}.za-form{animation-delay:.1s}
@keyframes zaRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* Kelgusi tur: chegara ohista "nafas oladi" */
.zh-seg.next{border-color:rgba(226,180,75,.7);color:var(--brass);animation:zhBreathe 3.2s ease-in-out infinite}
@keyframes zhBreathe{0%,100%{box-shadow:0 0 0 0 rgba(226,180,75,0)}50%{box-shadow:0 0 0 5px rgba(226,180,75,.16)}}
/* Reyting chiziqlari birinchi ochilishda o'sib chiqadi */
.zh-rank.grow .zh-rank-bar i{transform-origin:left;animation:zhGrow 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k) * 70ms + .2s)}
@keyframes zhGrow{from{transform:scaleX(0)}to{transform:none}}
/* Tugma va maydonlarda yumshoq javob */
.za-submit,.zh-link,.zh-task,.zh-seg{transition:background-color .2s,border-color .2s,transform .15s,filter .2s}
.za-submit:active,.zh-task:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.zb-c.on,.za-title,.za-lede,.za-stage .zb,.za-form,.zh-seg.next,.zh-rank.grow .zh-rank-bar i{animation:none!important}}

/* ===== Glass dizayn, navigatsiya, profil, medallar ===== */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:radial-gradient(1100px 600px at 8% -12%,#d5eee0 0%,transparent 60%),radial-gradient(900px 520px at 104% -4%,#f3e7c9 0%,transparent 55%),radial-gradient(1100px 700px at 50% 118%,#cde6d8 0%,transparent 62%),#edf3ef;background-attachment:fixed;min-height:100vh}
button,a,[role=button],[role=link]{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.glass,.card,.zh-panel{background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.78);box-shadow:0 10px 30px rgba(14,59,44,.07),inset 0 1px 0 rgba(255,255,255,.9);border-radius:20px}
.glass.pad{padding:22px 24px;margin-bottom:18px}
.h2{font:700 19px/1.25 var(--display);color:var(--baize);margin:0 0 12px;letter-spacing:-.005em}
.h3{font:700 14px/1.3 var(--display);color:var(--baize);margin:18px 0 8px}
.h2 .count{display:inline-block;margin-left:6px;font:600 13px/1 var(--text);color:#5b7066;background:rgba(14,59,44,.07);border-radius:99px;padding:4px 9px;vertical-align:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--colba);font-weight:650;text-decoration:underline;text-decoration-color:rgba(23,132,81,.3);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:currentColor}
.row{flex-wrap:wrap}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.clickrow{cursor:pointer}.clickrow:hover td{background:rgba(23,132,81,.05)}

/* Sarlavha — shisha */
.top{background:rgba(247,250,248,.62);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.7)}
.navbtn{border-radius:12px;transition:background-color .2s,color .2s}
.navbtn.active{background:rgba(23,132,81,.12)}
.tools{flex-wrap:nowrap}.tools .pill{white-space:nowrap}

/* Pastki menyu (telefon va planshet) */
.tabbar{display:none}
@media (max-width:1100px){
  .nav,.tools{display:none!important}
  .topin{height:62px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:40;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));height:64px;border-radius:22px;background:rgba(14,59,44,.74);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.16);box-shadow:0 12px 34px rgba(8,36,27,.28),inset 0 1px 0 rgba(255,255,255,.12);padding:6px}
  .tabbar:empty{display:none}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:rgba(243,246,241,.72);font:600 11px/1 var(--text);border-radius:16px;transition:background-color .2s,color .2s}
  .tab.on{color:var(--brass);background:rgba(255,255,255,.08)}
  main.shell{padding-bottom:104px}
  .foot{padding-bottom:96px}
}
body.is-auth .tabbar{display:none!important}

/* Ochiladigan menyu va surat ko'rish */
.sheet{position:fixed;inset:0;z-index:60;pointer-events:none}
.sheet.open{pointer-events:auto}
.sheet-bg{position:absolute;inset:0;background:rgba(8,30,22,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .2s ease-out}
.sheet-card{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;border-radius:24px;padding:10px 12px 12px;background:rgba(250,252,250,.86);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.85);box-shadow:0 20px 50px rgba(8,36,27,.3);animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
.sheet-grab{width:40px;height:4px;border-radius:9px;background:rgba(14,59,44,.18);margin:2px auto 10px}
.sheet-user{display:flex;justify-content:space-between;align-items:baseline;padding:6px 10px 12px;border-bottom:1px solid rgba(14,59,44,.08);margin-bottom:6px}
.sheet-user span{color:#6b7d74;font-size:13px}
.sheet-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:14px 12px;border-radius:14px;font:600 16px/1.2 var(--text);color:var(--ink)}
.sheet-item.on{background:rgba(23,132,81,.1);color:var(--colba)}
.sheet-item.danger{color:#a93e48}
.lightbox{position:absolute;inset:0;margin:0;display:grid;place-items:center;padding:24px;animation:fadeIn .2s ease-out}
.lightbox img{max-width:min(94vw,1400px);max-height:86vh;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}}

/* Sahifalar orasida yumshoq o'tish */
::view-transition-old(root){animation:vtOut .16s ease-in both}
::view-transition-new(root){animation:vtIn .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(8px)}}

/* Kirish sahifasi: hech qanday harakat yo'q */
.za *,.za{animation:none!important}
.za .zb-row,.za .zb-c,.za .zb-bar,.za .zb-body{transition:none!important}

/* Bosh sahifa reyting oynasi */
.hrank .zh-rank li{grid-template-columns:26px minmax(0,1.4fr) auto minmax(60px,1fr) 38px;cursor:pointer;border-radius:10px;transition:background-color .15s}
.hrank .zh-rank li:hover{background:rgba(23,132,81,.05)}
.dl{font:700 11px/1 var(--text);padding:4px 7px;border-radius:99px;white-space:nowrap}
.dl.up{color:#0f6e42;background:rgba(23,132,81,.12)}
.dl.down{color:#a2413f;background:rgba(219,88,97,.12)}
.dl.flat{color:#7b8b83;background:rgba(14,59,44,.06)}
.risers{margin-top:14px;padding-top:4px}
.riser{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.55);border-radius:14px;padding:11px 14px;margin-top:8px;font:inherit;color:inherit}
.riser:hover{background:rgba(255,255,255,.85)}
.riser-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.riser span:nth-child(2){color:#0f6e42;font-weight:650;font-size:13px}
.riser-pts{font:700 13px/1 var(--display);color:var(--brass-ink)}
.zh-cols>.glass.pad{margin-bottom:0}

/* Jamoa profili */
.backlink{display:inline-flex;align-items:center;gap:6px;margin:22px 0 12px;border:0;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:99px;padding:8px 14px 8px 10px;font-weight:650;color:var(--baize)}
.backlink::before{content:"";width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:4px}
.phero{display:grid;grid-template-columns:auto 1fr;gap:20px 24px;align-items:center;background:var(--baize);color:var(--chalk);border-radius:24px;padding:clamp(20px,3.4vw,36px);margin-bottom:18px;position:relative;overflow:hidden}
.phero::after{content:"";position:absolute;inset:-40% -10% auto auto;width:420px;height:420px;background:radial-gradient(circle,rgba(226,180,75,.18),transparent 65%);pointer-events:none}
.pavatar{width:96px;height:96px;border-radius:26px;overflow:hidden;background:linear-gradient(140deg,#1d6b4e,#0b2f23);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.pavatar img{width:100%;height:100%;object-fit:cover}
.pavatar span{font:800 32px/1 var(--display);color:var(--brass)}
.phead h1{font:800 clamp(26px,3.6vw,44px)/1.05 var(--display);margin:0 0 8px;letter-spacing:-.02em}
.phead p{margin:0;color:rgba(243,246,241,.74)}
.pmine{display:inline-block;margin-left:6px;background:rgba(226,180,75,.18);color:var(--brass);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:650}
.pstats{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;position:relative;z-index:1}
.pstat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pstat strong{display:block;font:700 20px/1.1 var(--display);color:var(--brass)}
.pstat span{font-size:12px;color:rgba(243,246,241,.66)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.pdesc{white-space:pre-wrap;line-height:1.6;margin:0;max-width:65ch}
.pmembers{margin:0;padding-left:20px;line-height:1.9}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{position:relative;margin:0;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:rgba(14,59,44,.06)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;animation:fadeIn .4s ease-out}
.ph-del{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(8,30,22,.6);color:#fff;font-size:18px;line-height:1;opacity:.9}
.ph-add{display:grid;place-items:center;align-content:center;gap:2px;border:1.5px dashed rgba(23,132,81,.4);background:rgba(255,255,255,.4);cursor:pointer;color:var(--colba)}
.ph-add span{font:700 28px/1 var(--display)}
.ph-add small{font-weight:600}
.act{width:100%;height:auto;margin:4px 0 10px}
.act-line{fill:none;stroke:var(--colba);stroke-width:2.5;stroke-linejoin:round}
.act-dot{fill:#fff;stroke:var(--colba);stroke-width:2.5}
.act-grid{stroke:rgba(14,59,44,.12);stroke-dasharray:3 4}
.act-ax{font:600 11px var(--text);fill:#7b8b83}
.ptable td,.ptable th{white-space:nowrap}
@media (max-width:900px){.pgrid{grid-template-columns:1fr}.phero{grid-template-columns:auto 1fr}.pavatar{width:72px;height:72px;border-radius:20px}.pavatar span{font-size:24px}}

/* Medallar: dumaloq, yozuvsiz, o'yilgan naqsh; yuqori darajalar o'z rangidagi nur bilan */
.inventory{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:18px 10px;justify-items:center}
.medal{display:grid;place-items:center;border:0;background:transparent;padding:10px;border-radius:50%;cursor:zoom-in;transition:transform .25s ease-out;animation:medalIn .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 45ms)}
@keyframes medalIn{from{opacity:0;transform:translateY(10px) scale(.92)}}
.medal-art{--s:70px;--aura:transparent;position:relative;display:inline-grid;place-items:center;flex:none;border-radius:50%}
.medal-art.sm{--s:40px}.medal-art.lg{--s:min(66vw,260px)}.medal-art.xs{--s:16px}
.medal-disc{position:relative;display:grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;box-shadow:inset 0 calc(var(--s) * .02) calc(var(--s) * .03) rgba(255,255,255,.8),inset 0 calc(var(--s) * -.05) calc(var(--s) * .09) rgba(0,0,0,.24),0 calc(var(--s) * .07) calc(var(--s) * .15) rgba(14,59,44,.22)}
.medal-art.xs .medal-disc{box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -2px 3px rgba(0,0,0,.22)}
.medal-ring{position:absolute;inset:9%;border-radius:50%;border:max(1px,calc(var(--s) * .012)) solid rgba(255,255,255,.5);box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
.medal-emblem{position:relative;width:62%;height:62%;color:rgba(80,50,10,.55);filter:drop-shadow(0 1px 0 rgba(255,255,255,.55)) drop-shadow(0 -1px 0 rgba(0,0,0,.18))}
.medal-art.xs .medal-ring{display:none}
/* Nur (aura): faqat yuqori darajalarda, ohista "nafas oladi" */
.medal-art.takrorlanmas{--aura:rgba(168,85,247,.8)}
.medal-art.afsonaviy{--aura:rgba(239,68,68,.7)}
.medal-art.oltin{--aura:rgba(250,204,21,.65)}
.medal-art.takrorlanmas,.medal-art.afsonaviy,.medal-art.oltin{animation:aura 3.4s ease-in-out infinite}
.medal-art.xs{animation:none!important;filter:drop-shadow(0 0 3px var(--aura))}
@keyframes aura{0%,100%{filter:drop-shadow(0 0 calc(var(--s) * .07) var(--aura))}50%{filter:drop-shadow(0 0 calc(var(--s) * .2) var(--aura))}}
/* Materiallar */
.medal-disc.bronza{background:radial-gradient(circle at 32% 26%,#f7d6b2,#c98149 48%,#8b4b22 90%)}
.medal-disc.bronza .medal-emblem{color:rgba(90,40,10,.5)}
.medal-disc.kumush{background:radial-gradient(circle at 32% 26%,#ffffff,#d3dadf 46%,#8e999f 90%)}
.medal-disc.kumush .medal-emblem{color:rgba(50,62,70,.45)}
.medal-disc.oltin{background:radial-gradient(circle at 32% 26%,#fff8d6,#f2c64f 42%,#b07b12 90%)}
.medal-disc.oltin .medal-emblem{color:rgba(120,72,0,.55)}
/* Afsonaviy: yoqut-qizil, oltin hoshiya */
.medal-disc.afsonaviy{background:radial-gradient(circle at 32% 26%,#ffd6cc,#f0525a 36%,#a3123a 68%,#4a0418 96%);box-shadow:inset 0 0 0 calc(var(--s) * .055) #e9b850,inset 0 0 0 calc(var(--s) * .07) rgba(80,10,10,.35),inset 0 calc(var(--s) * -.05) calc(var(--s) * .09) rgba(0,0,0,.3),0 calc(var(--s) * .07) calc(var(--s) * .15) rgba(80,10,20,.3)}
.medal-disc.afsonaviy .medal-ring{inset:14%;border-color:rgba(255,215,140,.7)}
.medal-disc.afsonaviy .medal-emblem{color:rgba(255,226,180,.92);filter:drop-shadow(0 1px 1px rgba(60,0,10,.55))}
/* Takrorlanmas: mifik — kosmik binafsha, tovlanuvchi hoshiya, sekin aylanuvchi nur */
.medal-disc.takrorlanmas{background:radial-gradient(circle at 32% 26%,#f6ecff,#b47cff 30%,#6d28d9 58%,#1f0a52 96%);box-shadow:inset 0 0 0 calc(var(--s) * .05) rgba(255,255,255,.35),inset 0 calc(var(--s) * -.05) calc(var(--s) * .1) rgba(10,0,40,.4),0 calc(var(--s) * .07) calc(var(--s) * .16) rgba(40,10,90,.35)}
.medal-disc.takrorlanmas::before{content:"";position:absolute;inset:-25%;background:conic-gradient(from 0deg,rgba(255,120,220,.35),rgba(120,200,255,.35),rgba(140,255,210,.3),rgba(255,230,140,.3),rgba(255,120,220,.35));mix-blend-mode:overlay;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.medal-disc.takrorlanmas .medal-ring{border-color:rgba(240,220,255,.75)}
.medal-disc.takrorlanmas .medal-emblem{color:#fbf5ff;filter:drop-shadow(0 0 calc(var(--s) * .04) rgba(230,200,255,.9))}
/* Yuqori darajalarda nozik yaltiroq */
.medal-disc.takrorlanmas::after,.medal-disc.afsonaviy::after,.medal-disc.oltin::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%);transform:translateX(-120%);animation:gemShine 7s ease-in-out infinite;animation-delay:calc(var(--i, 0) * 350ms + 1s)}
@keyframes gemShine{0%,84%{transform:translateX(-120%)}97%,100%{transform:translateX(120%)}}
.medal-art.xs .medal-disc::after,.medal-art.sm .medal-disc::after,.medal-art.xs .medal-disc::before{display:none}
.medal-legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:13px;color:#4d6258}
.medal-legend span{display:inline-flex;align-items:center;gap:7px}

/* Kattalashtirilgan medal */
.sheet.medalview .sheet-bg{background:rgba(6,26,19,.62);-webkit-backdrop-filter:blur(10px) saturate(120%);backdrop-filter:blur(10px) saturate(120%)}
.mview{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;pointer-events:none;animation:fadeIn .25s ease-out}
.mview>*{pointer-events:auto}
.mview-close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:24px;line-height:1;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mview-stage{perspective:1000px;cursor:pointer;-webkit-user-select:none;user-select:none}
.mview-3d{--rx:0deg;--ry:0deg;position:relative;display:grid;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .2s ease-out;animation:mviewIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes mviewIn{from{transform:scale(.6) rotateY(-30deg);opacity:0}}
.mview-front,.mview-back{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.mview-back{transform:rotateY(180deg);align-self:center;justify-self:center;width:min(66vw,260px);height:min(66vw,260px);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:12%;color:var(--ink);background:radial-gradient(circle at 32% 26%,#ffffff,#e9efeb 60%,#c9d5ce);box-shadow:inset 0 0 0 6px rgba(255,255,255,.6),0 20px 40px rgba(0,0,0,.35);font-size:14px;line-height:1.35}
.mview-back.oltin{background:radial-gradient(circle at 32% 26%,#fffbe9,#f4e3b1 60%,#d9b765)}
.mview-back.afsonaviy{background:radial-gradient(circle at 32% 26%,#fff3f1,#f6cfcf 60%,#e08a93)}
.mview-back.takrorlanmas{background:radial-gradient(circle at 32% 26%,#fbf7ff,#e6d8fb 60%,#b99be9)}
.mview-back.bronza{background:radial-gradient(circle at 32% 26%,#fff3e8,#efd1b6 60%,#c99a72)}
.mview-tier{font:800 18px/1 var(--display);color:var(--baize)}
.mview-back strong{font:700 15px/1.2 var(--display)}
.mview-back small{font-size:12px;color:#55675e}
.mview-stage.flip .mview-front{transform:rotateY(-180deg)}
.mview-stage.flip .mview-back{transform:rotateY(0deg)}
.mview-cap{display:flex;flex-direction:column;align-items:center;gap:2px;color:#f3f6f1;text-align:center}
.mview-cap strong{font:700 20px/1.2 var(--display)}
.mview-cap span{color:rgba(243,246,241,.75)}
.mview-nav{display:flex;gap:10px}
.mview-nav .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;min-width:48px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mview-hint{margin:0;color:rgba(243,246,241,.55);font-size:12px}

/* Savollar xaritasi */
.qtabs{margin:0 0 14px;flex-wrap:wrap}

// ---------- Marshrutlash: har bir sahifaning o'z manzili bor, "orqaga" tugmasi ishlaydi ----------
const SLUGS = {
  home: "", teams: "jamoalar", team: "jamoa", register: "jamoa-ochish", ranking: "reyting",
  results: "natijalar", questions: "savollar", appeals: "apellyatsiya", support: "yordam",
  manage: "boshqaruv", login: "kirish",
};
const PAGE_BY_SLUG = Object.fromEntries(Object.entries(SLUGS).map(([k, v]) => [v, k]));
let afterLogin = null;
function pageHash() {
  const slug = SLUGS[state.page] ?? "";
  const param =
    state.page === "team" ? state.teamId
    : state.page === "results" ? state.publicTourId
    : state.page === "questions" ? state.questionsTourId
    : state.page === "manage" ? state.adminTab

  return "#/" + slug + (param != null && param !== "" ? "/" + encodeURIComponent(param) : "");
}

  const [slug = "", param] = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  const page = PAGE_BY_SLUG[slug] || "home";
  state.page = page;
  if (page === "team") state.teamId = param || null;
  if (page === "results" && param) state.publicTourId = Number(param);
  if (page === "questions") state.questionsTourId = param ? Number(param) : null;
  if (page === "manage" && param) state.adminTab = param;

function render(scroll = true) {

  if (document.startViewTransition && state.page !== "login" && currentUser && !reduceMotion())

function setPage(p, param) {
  state.page = p;
  if (p === "team") state.teamId = param ?? state.teamId;
  if (p === "results" && param != null) state.publicTourId = Number(param);
  if (p === "questions") state.questionsTourId = param != null ? Number(param) : state.questionsTourId;

window.addEventListener("popstate", () => {

const ICONS = {
  home: '<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>',
  teams: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c2.6-.3 4.6 1.2 5 4.3"/>',
  ranking: '<path d="M4 20V13h4.5v7M9.75 20V8h4.5v12M15.5 20v-9H20v9"/>',
  questions: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><path d="M15 16.75h4M17 14.75v4"/>',
  more: '<circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/>',

const icon = (k) => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
function navLinks() {
  const links = [
    ["home", "Asosiy"],
    ["teams", "Jamoalar"],
    ["ranking", "Reyting"],
    ["results", "Tur natijalari"],

function nav() {

function calculate(t) {
  const a = active(t),
    n = a.length,
    // Savol reytingi: qatnashgan jamoalar − savolni topgan jamoalar + 1 (qiyin savol qimmatroq)
    allQ = Array.from({ length: 36 }, (_, q) => {
      const yes = a.reduce(
        (s, tm) => s + ((t.responses[tm.id] || {})[q] === 1 ? 1 : 0),
        0,
      );
      return n - yes + 1;
    });

    const res = t.responses[tm.id] || {};
    let count = 0,
      sr = 0;
    let rounds = [0, 0, 0];
    for (let q = 0; q < 36; q++)
      if (res[q] === 1) {
        count++;
        sr += allQ[q];
        rounds[Math.floor(q / 12)]++;
      }
    return { id: tm.id, name: tm.name, count, sr, rounds };
  });

    (a, b) =>
      b.count - a.count || b.sr - a.sr || a.name.localeCompare(b.name, "uz"),
  );

  });

// skipId: shu turni hisobga olmasdan (o'rin o'zgarishini topish uchun)
function summary(skipId) {
  const map = new Map(
    data.teams
      .filter((tm) => tm.approved || tm.status === "closed")
      .map((tm) => [
        tm.id,
        { id: tm.id, name: tm.name, closed: tm.status === "closed", points: 0, count: 0, sr: 0, played: 0, tours: {} },
      ]),
  );
  for (const t of listTours()) {
    if (!t.published || t.id === skipId) continue;
    for (const r of calculate(t)) {
      const x = map.get(r.id);
      if (x) {
        x.points += r.points;
        x.count += r.count;
        x.sr += r.sr;
        x.played++;
        x.tours[t.id] = r.points;
      }
    }
  }
  // Faoliyati tugatilgan jamoa faqat natijasi bo'lsa ko'rsatiladi
  const rows = [...map.values()]
    .filter((x) => !x.closed || x.played)
    .sort(
      (a, b) =>
        b.points - a.points ||
        b.count - a.count ||
        b.sr - a.sr ||
        a.name.localeCompare(b.name, "uz"),
    );
  let rank = 0;
  return rows.map((x, i) => {
    const p = rows[i - 1];

  });

const MEDALS = {

// Jamoa inventari: takrorlanmas/afsonaviy/oltin — har biri alohida; kumush/bronza — tur bo'yicha bitta medalga yig'iladi
function teamMedals(teamId) {

  for (const t of listTours()) {
    if (!t.published || !(t.activeTeams || []).includes(teamId)) continue;

    for (const x of questionStats(t)) {
      if (!x.tier || !x.solvers.some((tm) => tm.id === teamId)) continue;
      if (MEDALS[x.tier].rank >= 3) out.push({ tier: x.tier, tour: t, qs: [x.q + 1], s: x.solvers.length, n: x.n });

    }
    out.push(...Object.values(grouped));
  }

// Dumaloq medal: yozuvsiz, o'yilgan naqsh. Nima uchun berilgani faqat orqa tomonda.
const MEDAL_EMBLEM = `<svg class="medal-emblem" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/><path d="M50 22 55.2 41.6 74.8 36.6 60.4 50 74.8 63.4 55.2 58.4 50 78 44.8 58.4 25.2 63.4 39.6 50 25.2 36.6 44.8 41.6Z" fill="currentColor"/><circle cx="50" cy="50" r="5" fill="currentColor" opacity=".55"/></svg>`;

function medalCard(m, i) {

function resizeImage(file, max = 1600, quality = 0.82) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => fail(Error("Rasmni o‘qib bo‘lmadi"));
    img.src = URL.createObjectURL(file);
  });
}

function rankMovement() {
  const pub = listTours().filter((t) => t.published);
  const now = summary();
  if (pub.length < 2) return { now, delta: {}, last: pub[pub.length - 1] };
  const last = pub[pub.length - 1];
  const before = Object.fromEntries(summary(last.id).map((x) => [x.id, x]));
  const delta = {};
  for (const x of now) if (before[x.id]?.played) delta[x.id] = { places: before[x.id].rank - x.rank, gained: x.points - before[x.id].points };
  return { now, delta, last };
}
const deltaBadge = (d) =>
  !d ? '<span class="dl flat">yangi</span>' : d.places > 0 ? `<span class="dl up">▲ ${d.places}</span>` : d.places < 0 ? `<span class="dl down">▼ ${-d.places}</span>` : '<span class="dl flat">—</span>';
function homeRanking() {
  const { now, delta, last } = rankMovement();
  if (!now.length || !now[0].points) return `<section class="glass pad"><h2 class="h2">Reyting</h2><p class="zh-muted">Reyting birinchi tur natijasi e’lon qilingach shakllanadi.</p></section>`;
  const max = Math.max(1, ...now.map((x) => x.points));
  const risers = Object.keys(delta).length
    ? now.filter((x) => delta[x.id]).sort((a, b) => delta[b.id].places - delta[a.id].places || delta[b.id].gained - delta[a.id].gained).slice(0, 3)
    : [];
  return `<section class="glass pad hrank"><div class="zh-board-head"><h2 class="h2">Reyting</h2><button class="zh-link" onclick="go('ranking')">To‘liq reyting</button></div>
<ol class="zh-rank${zbPlayed.has("rank:" + state.page) ? "" : " grow"}">${now

// ---------- Jonli hisob taxtasi (bosh sahifa va kirish sahifasi) ----------
// Bitta komponent: jamoalar × 36 savol. Savol reytingi = jamoalar − topganlar + 1; o'rin: jami → SR → nom.
const ZB = {},
  zbPlayed = new Set(),
  ZB_ROW = () => (window.matchMedia("(max-width: 640px)").matches ? 30 : 34),
  reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function zbDemoTeams() {
  let x = 3;
  const rnd = () => (x = (x * 1103515245 + 12345) % 2147483648) / 2147483648;
  const strength = [0.78, 0.66, 0.6, 0.6, 0.47, 0.36],
    diff = Array.from({ length: 36 }, () => rnd()),
    names = ["Bilimdonlar", "Zukkolar", "Mantiq", "Kashfiyot", "Tafakkur", "Yulduzlar"];
  return strength.map((s, i) => ({ name: names[i], ans: diff.map((d) => (rnd() < s * (1.25 - d) ? 1 : 0)) }));
}
function zbModel(teams, upto = 36) {
  const n = teams.length;
  const rating = Array.from({ length: 36 }, (_, q) => n - teams.reduce((a, t) => a + (q < upto && t.ans[q] ? 1 : 0), 0) + 1);
  const rows = teams.map((t, i) => {
    let count = 0,
      sr = 0;
    for (let q = 0; q < upto; q++)
      if (t.ans[q]) {
        count++;
        sr += rating[q];
      }
    return { i, name: t.name, count, sr };
  });
  const order = [...rows].sort((a, b) => b.count - a.count || b.sr - a.sr || a.name.localeCompare(b.name, "uz"));
  let pos = 0;
  order.forEach((r, k) => {
    const p = order[k - 1];
    if (!p || p.count !== r.count || p.sr !== r.sr) pos = k + 1;
    r.pos = pos;
    r.slot = k;
  });
  return { n, rating, rows, upto };
}
function zbHTML(id, teams, opts = {}) {
  ZB[id] = { teams, opts };
  const m = zbModel(teams),
    vis = Math.min(teams.length, opts.limit || teams.length);
  const cells = (t, i) =>
    t.ans
      .map(
        (v, q) =>
          `${q && q % 12 === 0 ? '<i class="zb-gap"></i>' : ""}<b class="zb-c${v ? " on" : ""}" style="--q:${q};--r:${i}" data-t="${i}" data-q="${q}"${opts.interactive ? ` role="button" tabindex="-1" aria-label="${h(t.name)}, ${q + 1}-savol"` : ""}></b>`,
      )
      .join("");
  const rows = m.rows
    .map(
      (r) =>
        `<div class="zb-row" data-row="${r.i}" style="transform:translateY(${r.slot * ZB_ROW()}px)${r.slot >= vis ? ";display:none" : ""}"><span class="zb-pos">${r.pos}</span><span class="zb-name" title="${h(r.name)}">${h(r.name)}</span><span class="zb-cells">${cells(teams[r.i], r.i)}</span><span class="zb-num zb-count">${r.count}</span><span class="zb-num zb-sr">${r.sr}</span></div>`,
    )
    .join("");
  const bars = m.rating
    .map((v, q) => `${q && q % 12 === 0 ? '<i class="zb-gap"></i>' : ""}<b class="zb-bar" data-q="${q}" style="--h:${v / (m.n + 1)}"></b>`)
    .join("");
  return `<div class="zb${opts.interactive ? " zb-live" : ""}" id="${id}"><div class="zb-head"><span></span><span></span><span class="zb-rounds"><span>1-raund</span><span>2-raund</span><span>3-raund</span></span><span class="zb-num">Jami</span><span class="zb-num">SR</span></div><div class="zb-body" style="height:${vis * ZB_ROW()}px">${rows}</div><div class="zb-foot"><span></span><span class="zb-foot-label">Savol reytingi</span><span class="zb-cells">${bars}</span><span></span><span></span></div><p class="zb-cap" aria-live="polite">${h(opts.caption || "")}</p></div>`;
}
function zbApply(id, upto = 36) {
  const st = ZB[id],
    el = $(id);
  if (!st || !el) return;
  const m = zbModel(st.teams, upto),
    rowH = ZB_ROW(),
    vis = Math.min(st.teams.length, st.opts.limit || st.teams.length);
  el.querySelector(".zb-body").style.height = vis * rowH + "px";
  for (const r of m.rows) {
    const row = el.querySelector(`[data-row="${r.i}"]`);
    row.style.transform = `translateY(${r.slot * rowH}px)`;
    row.style.display = r.slot >= vis ? "none" : "";
    row.querySelector(".zb-pos").textContent = r.pos;
    row.querySelector(".zb-count").textContent = r.count;
    row.querySelector(".zb-sr").textContent = r.sr;
    row.classList.toggle("lead", r.pos === 1 && r.count > 0);
  }
  el.querySelectorAll(".zb-bar").forEach((b) => {
    const q = +b.dataset.q;
    b.style.setProperty("--h", q < upto ? m.rating[q] / (m.n + 1) : 0);
  });
  return m;
}
function zbCaption(id, q) {
  const st = ZB[id],
    el = $(id);
  if (!st || !el) return;
  const cap = el.querySelector(".zb-cap");
  if (q == null) return (cap.textContent = st.opts.caption || "");
  const m = zbModel(st.teams),
    solved = m.n - m.rating[q] + 1;
  cap.textContent = solved
    ? `${q + 1}-savol: ${m.n} jamoadan ${solved} tasi topdi → savol reytingi ${m.n} − ${solved} + 1 = ${m.rating[q]}. Uni topgan har bir jamoaning SR'iga ${m.rating[q]} qo‘shiladi.`
    : `${q + 1}-savol: hech kim topmadi — reytingi ${m.rating[q]}, lekin hech kimga ball bermaydi.`;
}
function zbMount(id) {
  const st = ZB[id],
    el = $(id);
  if (!st || !el) return;
  const focusCol = (q) => {
    el.querySelectorAll(".zb-hot").forEach((c) => c.classList.remove("zb-hot"));
    if (q == null) return zbCaption(id, null);
    el.querySelectorAll(`[data-q="${q}"]`).forEach((c) => c.classList.add("zb-hot"));
    zbCaption(id, q);
  };
  el.addEventListener("mouseover", (e) => {
    const c = e.target.closest("[data-q]");
    if (c) focusCol(+c.dataset.q);
  });
  el.addEventListener("mouseleave", () => focusCol(null));
  if (st.opts.interactive)
    el.addEventListener("click", (e) => {
      const c = e.target.closest(".zb-c");
      if (!c) return;
      const t = +c.dataset.t,
        q = +c.dataset.q;
      st.teams[t].ans[q] = st.teams[t].ans[q] ? 0 : 1;
      c.classList.toggle("on", !!st.teams[t].ans[q]);
      zbApply(id);
      focusCol(q);
    });
  // Bitta orkestrlangan lahza: javoblar savolma-savol tushadi, har raund oxirida o'rinlar almashadi.
  // Holat elementda emas, zbAnim'da — sahifa qayta chizilsa ham animatsiya o'sha joyidan davom etadi.
  const key = id + ":" + state.page;
  if (state.page === "login") return zbApply(id);
  const run = zbAnim[id];
  if (run && run.key === key) return zbPaint(id, run.q);
  if (zbPlayed.has(key) || reduceMotion()) return zbApply(id);
  zbPlayed.add(key);
  zbAnim[id] = { key, q: 0 };
  zbPaint(id, 0);
  const tick = () => {
    const a = zbAnim[id];
    if (!a || !$(id)) return delete zbAnim[id];
    a.q++;
    zbPaint(id, a.q);
    if (a.q < 36) setTimeout(tick, a.q % 12 === 0 ? 380 : 38);
    else {
      delete zbAnim[id];
      $(id).classList.remove("zb-play");
      zbApply(id);
    }
  };
  setTimeout(tick, 350);
}
const zbAnim = {};
function zbPaint(id, q) {
  const el = $(id),
    st = ZB[id];
  if (!el || !st) return;
  el.classList.add("zb-play");
  el.querySelectorAll(".zb-c").forEach((c) => c.classList.toggle("in", +c.dataset.q < q));
  // O'rinlar faqat raund tugaganda almashadi; sanoq har savolda o'sadi
  zbApply(id, Math.floor(q / 12) * 12);
  el.querySelectorAll(".zb-row").forEach((row) => {
    const t = st.teams[+row.dataset.row];
    let c = 0;
    for (let k = 0; k < q; k++) c += t.ans[k] ? 1 : 0;
    row.querySelector(".zb-count").textContent = c;
  });
}
function zbFromTour(t) {
  const res = calculate(t);
  const teams = res.map((r) => ({
    name: r.name,
    ans: Array.from({ length: 36 }, (_, q) => ((t.responses[r.id] || {})[q] === 1 ? 1 : 0)),
  }));
  return { teams, total: res.length };
}

const APPEAL_SENT = "Yuborildi",
  APPEAL_REVIEW = "Ko‘rib chiqilmoqda",
  APPEAL_DONE = "Ko‘rib chiqildi";
function appealBadge(status) {
  const style =
    status === APPEAL_DONE
      ? ""
      : status === APPEAL_REVIEW
        ? ' style="background:#e7f0fd;color:#2457a6"'
        : ' style="background:#fff4dc;color:#9a6a00"';
  return `<span class="tag"${style}>${h(status)}</span>`;
}
function appealSteps(status) {
  const steps = [APPEAL_SENT, APPEAL_REVIEW, APPEAL_DONE];
  const cur = steps.indexOf(status);
  return `<div class="row" style="gap:6px;margin:8px 0;flex-wrap:wrap">${steps
    .map(
      (x, i) =>
        `<span style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;${i <= cur ? "background:var(--mint);color:var(--green)" : "background:#f1f3f2;color:#9aa8a1"}">${i < cur ? "✓ " : ""}${h(x)}</span>${i < 2 ? '<span class="muted">→</span>' : ""}`,
    )
    .join("")}</div>`;
}

window.appealAnswerInfo = () => {
  const el = $("appealAnswer"),
    t = tour($("appealTour")?.value),
    q = Number($("appealQuestion")?.value),
    tm = myTeams().find((x) => x.approved);
  if (!el) return;
  if (!t || !q) return (el.textContent = "");
  if (!t.published || !t.responses) return (el.textContent = `${t.title} natijasi hali e’lon qilinmagan.`);
  const yes = (t.responses[tm?.id] || {})[q - 1] === 1;
  el.innerHTML = `Jadvalda ${q}-savol uchun jamoangizga: <strong style="color:${yes ? "var(--green)" : "var(--red)"}">${yes ? "+ (to‘g‘ri)" : "− (noto‘g‘ri)"}</strong>`;
};
window.countAppealWords = () => {

function scoresAdmin() {
  const t = selectedTour();

  const players = active(t),
    r = state.round,
    base = (r - 1) * 12,
    stats = calculate(t),
    scoring = new Map(stats.map((s) => [s.id, s]));
  return `<div class="card pad"><div class="row between"><div><h2 style="margin:0 0 4px">Javoblarni kiritish</h2><span class="notice">Bu jadval faqat admin va sayt egasiga ko‘rinadi.</span></div><span class="status ${t.published ? "ok" : ""}">${t.published ? "Natijalar e’lon qilingan" : "Natijalar yopiq"}</span></div><div class="spacer"></div><div class="controls">${adminTourPicker()}<div class="row">${[1, 2, 3].map((n) => `<button class="tabchip ${n === r ? "active" : ""}" onclick="selectRound(${n})">R${n} · ${12 * (n - 1) + 1}–${12 * n}</button>`).join("")}</div></div><p class="notice">Har bir katakdagi <strong>−</strong> belgisini bossangiz <strong>+</strong> ga, yana bossangiz <strong>−</strong> ga o‘zgaradi. Sichqoncha bilan kursor joylashgan <strong>jamoa qatori va savol ustuni</strong> ajratib ko‘rsatiladi. O‘zgarishlar avtomatik saqlanadi.</p>${
    players.length
      ? `<div class="scoreboardwrap"><table class="scoreboard" id="scoreboard"><thead><tr><th>Jamoa / Savol</th>${Array.from({ length: 12 }, (_, j) => `<th data-col="${j}">S${base + j + 1}</th>`).join("")}<th>R${r} jami</th></tr></thead><tbody>${players
          .map((tm) => {
            const obj = t.responses[tm.id] || {};
            return `<tr data-team="${tm.id}"><td>${h(tm.name)}</td>${Array.from(
              { length: 12 },
              (_, j) => {
                const q = base + j,
                  yes = obj[q] === 1;
                return `<td data-col="${j}" data-tm="${tm.id}"><button type="button" class="${yes ? "yes" : "no"}" onclick="flip('${tm.id}',${q})" ${t.published ? "disabled" : ""} title="${h(tm.name)} · ${q + 1}-savol: ${yes ? "to‘g‘ri" : "noto‘g‘ri"}">${yes ? "+" : "−"}</button></td>`;
              },
            ).join(
              "",
            )}<td class="summary">${scoring.get(tm.id)?.rounds[r - 1] ?? 0}</td></tr>`;
          })
          .join("")}</tbody></table></div>`
      : `<div class="empty">Bu turda jamoa tanlanmagan. “Tur jamoalari” bo‘limida qatnashuvchilarni belgilang.</div>`

let importOpen = false,

  importPreview = null;
// Sheets'dan nusxalangan matn: ustunlar TAB bilan, ichida qator bo'lgan katakchalar qo'shtirnoqda
function parseTSV(text) {
  const rows = [];
  let row = [],
    cell = "",
    quoted = false;
  text = text.replace(/\r\n?/g, "\n");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else if (c === '"') quoted = false;
      else cell += c;
    } else if (c === '"' && cell === "") quoted = true;
    else if (c === "\t") {
      row.push(cell);
      cell = "";
    } else if (c === "\n") {
      row.push(cell);
      rows.push(row);
      row = [];
      cell = "";
    } else cell += c;
  }
  row.push(cell);
  rows.push(row);
  return rows.filter((r) => r.some((x) => x.trim()));
}
function mapImportRows(table) {
  const norm = (x) => x.toLocaleLowerCase("uz").replace(/[’‘ʻ`']/g, "");
  const head = table[0].map(norm);
  const find = (...keys) => head.findIndex((x) => keys.some((k) => x.includes(k)));
  let col = { name: find("nomi", "jamoa (guruh)"), leader: find("lider", "sardor"), members: find("azo"), branch: find("filial") };
  let body = table.slice(1);
  if (col.name < 0 || col.members < 0) {
    // Sarlavhasiz: Google Form'ning to'liq qatori (7 ustun) yoki 4 ustun: nom, lider, a'zolar, filial
    body = table;
    const w = Math.max(...table.map((r) => r.length));
    col = w >= 7 ? { name: 3, leader: 4, members: 5, branch: 6 } : { name: 0, leader: 1, members: 2, branch: 3 };
  }
  return body.map((r) => ({
    name: r[col.name] || "",
    leader: col.leader >= 0 ? r[col.leader] || "" : "",
    members: r[col.members] || "",
    branch: col.branch >= 0 ? r[col.branch] || "" : "",
  }));
}

const fmtBytes = (b) =>

      ? (b / 1024).toFixed(0) + " KB"

        ? (b / 1048576).toFixed(1) + " MB"

const fmtUptime = (sec) => {
  const d = Math.floor(sec / 86400),
    hh = Math.floor((sec % 86400) / 3600),
    mm = Math.floor((sec % 3600) / 60);
  return (d ? d + " kun " : "") + (hh ? hh + " soat " : "") + mm + " daqiqa";
};
const money = (v) => (v == null ? "—" : "$" + Number(v).toFixed(2));
const num = (v, suf = "") => (v == null ? "—" : v + suf);
function lineChart(series, lines, opts = {}) {
  const W = 640,
    H = opts.height || 170,
    L = 46,
    R = 10,
    T = 10,
    B = 24;
  if (!series.length)
    return '<div class="empty" style="padding:30px">Bu davr uchun o‘lchov yo‘q. Ma’lumot har daqiqada yig‘iladi.</div>';
  const vals = series.flatMap((p) => lines.map((l) => p[l.key]).filter((v) => v != null));
  const max = Math.max(opts.min || 1, ...vals, opts.limit || 0) * 1.1;
  const x = (i) => L + (series.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (series.length - 1));
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const grid = [0, 0.5, 1]
    .map((f) => `<line x1="${L}" x2="${W - R}" y1="${y(max * f / 1.1)}" y2="${y(max * f / 1.1)}" stroke="#e6ece8"/><text x="${L - 6}" y="${y(max * f / 1.1) + 4}" text-anchor="end" font-size="10" fill="#8a9a92">${Math.round((max * f) / 1.1)}${opts.unit || ""}</text>`)
    .join("");
  const limitLine =
    opts.limit && opts.limit < max
      ? `<line x1="${L}" x2="${W - R}" y1="${y(opts.limit)}" y2="${y(opts.limit)}" stroke="#db5861" stroke-dasharray="4 4"/><text x="${W - R}" y="${y(opts.limit) - 4}" text-anchor="end" font-size="10" fill="#db5861">limit ${opts.limit}${opts.unit || ""}</text>`
      : "";
  const paths = lines
    .map((l) => {
      const pts = series.map((p, i) => (p[l.key] == null ? null : `${x(i).toFixed(1)},${y(p[l.key]).toFixed(1)}`)).filter(Boolean);
      if (pts.length === 1) {
        const [cx, cy] = pts[0].split(",");
        return `<circle cx="${cx}" cy="${cy}" r="3.5" fill="${l.color}"/>`;
      }
      return `<polyline fill="none" stroke="${l.color}" stroke-width="2" stroke-linejoin="round" points="${pts.join(" ")}"/>`;
    })
    .join("");
  const first = new Date(series[0].t),
    last = new Date(series[series.length - 1].t);
  const tf = (d) => d.toLocaleString("uz-UZ", monRange === "1h" || monRange === "24h" ? { hour: "2-digit", minute: "2-digit" } : { day: "2-digit", month: "2-digit", hour: "2-digit" });
  const legend = lines.map((l) => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><span style="width:12px;height:3px;background:${l.color};display:inline-block"></span>${h(l.label)}</span>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${limitLine}${paths}<text x="${L}" y="${H - 6}" font-size="10" fill="#8a9a92">${tf(first)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="10" fill="#8a9a92">${tf(last)}</text></svg><div class="notice">${legend}</div>`;
}

}

function installGridHover() {
  const table = $("scoreboard");
  if (!table) return;
  table.addEventListener("mouseover", (e) => {
    let td = e.target.closest("td[data-col]");
    if (!td) return;
    let row = td.parentElement,
      j = td.dataset.col;
    table
      .querySelectorAll(".axis,.cross")
      .forEach((x) => x.classList.remove("axis", "cross"));
    row.querySelectorAll("td").forEach((x) => x.classList.add("axis"));
    table
      .querySelectorAll(`[data-col="${j}"]`)
      .forEach((x) => x.classList.add("axis"));
    td.classList.add("cross");
  });
  table.addEventListener("mouseleave", () =>
    table
      .querySelectorAll(".axis,.cross")
      .forEach((x) => x.classList.remove("axis", "cross")),
  );
}
function draw() {
  if (!currentUser) state.page = "login";
  if (state.page === "appeals" && !data.appealEnabled) state.page = "home";
  if (state.page === "manage" && state.role === "public") state.page = "login";
  shell();
  document.body.classList.toggle("is-auth", state.page === "login");
  $("app").innerHTML = (
    {
      home: home,
      teams: teamsPage,
      register: registerPage,
      ranking: rankingPage,
      results: resultPage,
      appeals: appealsPage,
      support: supportPage,
      team: teamProfilePage,
      questions: questionsPage,
      login: loginPage,
      manage: adminPage,
    }[state.page] || home
  )();
  installGridHover();
  for (const id of ["zbDemo", "zbHome"]) if ($(id)) zbMount(id);
  if (document.querySelector(".zh-rank.grow")) zbPlayed.add("rank:" + state.page);
}
draw();
initAuth();
